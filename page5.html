<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O momento constante 🫂💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==========================================
         TÍTULO DA PÁGINA
    =========================================== -->
    <h1>O momento constante 🫂💖</h1>


    <!-- ==========================================
         TEXTO PRINCIPAL
    =========================================== -->
    <p>
        No fim, entre risos e choros, o que torna essa amizade especial não são poucos momentos, mas sim quem você é:<br><br>
        <span class="impact">UM GRANDE AMIGO.</span>
    </p>


    <!-- ==========================================
         BOTÃO DE NAVEGAÇÃO
         (O href indica para qual link o botão vai)
    =========================================== -->
    <a href="https://drive.google.com/file/d/1_oL6gQCWvmrwmPIG8d1YKB0RS02NsRwW/view?usp=sharing" class="btn">VÍDEO 🎬</a>


    <!-- ==========================================
         ÁUDIO (Mude o src="" para o nome do seu arquivo, ex: 1.mp3)
    =========================================== -->
    <audio id="audioFundo" src="5.mp3" preload="auto"></audio>


    <!-- ==========================================
         SCRIPT PARA TOCAR O ÁUDIO AUTOMATICAMENTE
    =========================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audioFundo');
            
            // Tenta tocar o áudio assim que a página carrega
            audio.play().catch(error => {
                console.log("O navegador bloqueou o autoplay. O áudio será iniciado ao primeiro clique.");
            });
            
            // Caso o navegador bloqueie (comum hoje em dia), toca no primeiro clique em qualquer lugar da tela
            document.body.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                }
            }, { once: true });
        });
    </script>

</body>
</html>
